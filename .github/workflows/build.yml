name: build-deb

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "ZeroTier tag to build (empty = upstream latest release)"
        required: false
        default: ""
      release:
        description: "Publish a GitHub release for this tag"
        type: boolean
        default: true
  schedule:
    - cron: "17 2 * * *" # daily 02:17 UTC — follow upstream releases
  push:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"
      - "deb/**"

permissions:
  contents: write

concurrency:
  group: build-deb
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve upstream tag
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.r.outputs.tag }}
      has_release: ${{ steps.r.outputs.has_release }}
    steps:
      - name: Resolve tag
        id: r
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh api repos/zerotier/ZeroTierOne/releases/latest --jq .tag_name)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "zt-$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "has_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Building ZeroTier $TAG"

  build:
    name: Build EdgeOS deb (MIPS64)
    needs: resolve
    runs-on: ubuntu-22.04
    steps:
      - name: Cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            g++-mips64-linux-gnuabi64 binutils-mips64-linux-gnuabi64
          mips64-linux-gnuabi64-g++ --version | head -1

      - uses: actions/checkout@v4

      - name: Clone upstream
        run: |
          git clone --depth 1 --branch "${{ needs.resolve.outputs.tag }}" --recursive \
            https://github.com/zerotier/ZeroTierOne.git src

      - name: Build (dynamic)
        working-directory: src
        run: |
          set -euo pipefail
          make -j"$(nproc)" ZT_UBIQUITI=1 \
            CC=mips64-linux-gnuabi64-gcc CXX=mips64-linux-gnuabi64-g++ \
            CFLAGS="-O2 -fstack-protector" CXXFLAGS="-O2" \
            LDFLAGS="-no-pie -Wl,-z,noexecstack" zerotier-one
          mips64-linux-gnuabi64-strip --strip-unneeded zerotier-one

      - name: Bundle runtime
        run: |
          set -euo pipefail
          mkdir -p dist/ztlib/lib dist/ztlib/lib64
          cp src/zerotier-one dist/zt-dyn
          cp /usr/mips64-linux-gnuabi64/lib64/ld.so.1 dist/ztlib/lib64/
          for f in libc.so.6 libm.so.6 libstdc++.so.6 libgcc_s.so.1; do
            cp "/usr/mips64-linux-gnuabi64/lib/$f" dist/ztlib/lib/
          done
          mips64-linux-gnuabi64-strip --strip-unneeded dist/ztlib/lib/*.so.* dist/ztlib/lib64/ld.so.1
          chmod 755 dist/zt-dyn dist/ztlib/lib64/ld.so.1
          find dist -type f -exec file {} \;

      - name: Build EdgeOS deb
        run: |
          set -euo pipefail
          TAG="${{ needs.resolve.outputs.tag }}"
          sed -i "s/Version: .*/Version: $TAG/" deb/DEBIAN/control
          chmod +x deb/build-deb.sh
          ./deb/build-deb.sh dist "zerotier-one-edgeos_${TAG}_all.deb"
          sha256sum "zerotier-one-edgeos_${TAG}_all.deb" | awk '{print $1}' \
            > "zerotier-one-edgeos_${TAG}_all.deb.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: zerotier-one-edgeos-${{ needs.resolve.outputs.tag }}
          path: |
            zerotier-one-edgeos_*.deb
            zerotier-one-edgeos_*.deb.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: [resolve, build]
    if: needs.resolve.outputs.has_release == 'false' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.release))
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zerotier-one-edgeos-${{ needs.resolve.outputs.tag }}

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          Self-contained EdgeOS package for ER-4 / ER-6P / ER-12 (MIPS64), built from upstream ZeroTier \`$TAG\`.

          Dynamic build with a bundled glibc 2.35 runtime — static builds from this toolchain crash at runtime on MIPS (\`epc=0\` inside \`std::condition_variable::wait\`), so they are not shipped here.

          ### Install

          \`\`\`
          sudo dpkg -i zerotier-one-edgeos_${TAG}_all.deb
          \`\`\`

          Installs to \`/config/zt\`, adds an auto-start hook at \`/config/scripts/post-config.d/zerotier-start.sh\`, and starts the daemon.

          ### Join a network

          \`\`\`
          sudo /config/zt/ztlib/lib64/ld.so.1 --library-path /config/zt/ztlib/lib \\
            /config/zt/zt-dyn -q -p9993 -T\\$(cat /config/zt/home/authtoken.secret) join <network-id>
          \`\`\`

          The \`zt\` interface only appears after joining. Verify with \`netstat -lnup | grep 9993\`.

          ### Lifecycle

          - \`sudo dpkg -r zerotier-one-edgeos\` — stop, remove auto-start hook, keep identity in \`/config/zt/home\`
          - \`sudo dpkg -P zerotier-one-edgeos\` — purge, removes \`/config/zt\`
          - copy the deb to \`/config/data/firstboot/install-packages/\` so EdgeOS reinstalls it after a firmware upgrade
          EOF
          ls -l
          gh release create "zt-$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "ZeroTier $TAG for EdgeOS (MIPS64, ER-4)" \
            --notes-file notes.md \
            zerotier-one-edgeos_*.deb zerotier-one-edgeos_*.deb.sha256
